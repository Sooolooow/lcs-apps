<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCS Material Estimator</title>
<style>
  :root { --bg:#0a0a0a; --steel:#c0c0c0; --accent:#ff3b00; --panel:#141414; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--steel); font-family:'Inter',system-ui,sans-serif; padding:24px; }
  h1 { font-size:1.4rem; letter-spacing:.05em; margin-bottom:4px; }
  .sub { color:#666; font-size:.85rem; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:900px; }
  .card { background:var(--panel); border:1px solid #222; border-radius:12px; padding:20px; }
  label { display:block; font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:#888; margin-bottom:6px; }
  input, select { width:100%; background:#0d0d0d; border:1px solid #2a2a2a; color:var(--steel); padding:10px 12px; border-radius:8px; font-size:.95rem; margin-bottom:14px; }
  .result { font-size:1.8rem; font-weight:700; color:#fff; }
  .detail { font-size:.85rem; color:#888; margin-top:8px; line-height:1.6; }
  .btn { background:var(--accent); color:#fff; border:none; padding:12px 20px; border-radius:8px; font-weight:600; cursor:pointer; width:100%; }
</style>
</head>
<body>
  <h1>MATERIAL ESTIMATOR</h1>
  <div class="sub">Sheet count, weight, and scrap · before you cut</div>
  <div class="grid">
    <div class="card">
      <label>Part dimensions (in)</label>
      <div style="display:flex;gap:12px">
        <input id="L" type="number" value="120" placeholder="Length">
        <input id="W" type="number" value="24" placeholder="Width">
      </div>
      <label>Sheet size (in)</label>
      <select id="sheet">
        <option value="48x96">48 x 96 (4x8)</option>
        <option value="48x120">48 x 120 (4x10)</option>
        <option value="60x120">60 x 120 (5x10)</option>
      </select>
      <label>Gauge</label>
      <select id="gauge">
        <option value="16">16 ga (0.0625")</option>
        <option value="14">14 ga (0.0781")</option>
        <option value="12">12 ga (0.1094")</option>
      </select>
      <button class="btn" onclick="est()">ESTIMATE</button>
    </div>
    <div class="card">
      <div class="result" id="out">—</div>
      <div class="detail" id="det"></div>
    </div>
  </div>
<script>
const THICK={16:0.0625,14:0.0781,12:0.1094};
const DENS=0.289; // lb/in³ for 304 SS
function est(){
  const L=+document.getElementById('L').value, W=+document.getElementById('W').value;
  const [sw,sh]=document.getElementById('sheet').value.split('x').map(Number);
  const g=+document.getElementById('gauge').value;
  const t=THICK[g];
  const area=L*W;
  const sheetArea=sw*sh;
  const sheets=Math.ceil(area/sheetArea);
  const weight=area*t*DENS;
  const scrap=((sheets*sheetArea-area)/sheetArea*100).toFixed(0);
  document.getElementById('out').textContent=sheets+' sheet'+(sheets>1?'s':'');
  document.getElementById('det').innerHTML=`
    Part area: ${area} in²<br>
    Sheet area: ${sheetArea} in²<br>
    Est. weight: ${weight.toFixed(1)} lb<br>
    Scrap: ${scrap}%<br>
    Thickness: ${t}" (${g} ga)`;
}
est();
</script>
</body>
</html>
